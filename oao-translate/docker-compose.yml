services:
  server:
    build:
      context: .
      target: server
    env_file: .env
    environment:
      PORT: 3001
      CORS_ORIGIN: http://localhost,http://127.0.0.1,http://web:3000
    volumes:
      - oao-history:/data
    expose:
      - "3001"
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    env_file: .env
    environment:
      OAO_TRANSLATE_SERVER_URL: http://server:3001
      NEXT_PUBLIC_SOCKET_URL: http://localhost/socket
    depends_on:
      - server
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - server
    restart: unless-stopped

volumes:
  oao-history:
